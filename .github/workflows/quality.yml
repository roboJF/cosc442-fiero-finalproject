name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests, JaCoCo, PIT, and SpotBugs
        id: quality
        run: bash ./mvnw -B clean verify -Pquality

      - name: Summarize JaCoCo coverage
        if: ${{ !cancelled() }}
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("target/site/jacoco/jacoco.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## JaCoCo coverage\n", file=summary)
              if not report.is_file():
                  print("JaCoCo did not generate a coverage report.", file=summary)
                  if os.environ["QUALITY_OUTCOME"] == "success":
                      raise SystemExit("Expected JaCoCo coverage report is missing.")
                  raise SystemExit(0)

              root = ET.parse(report).getroot()
              print("| Metric | Coverage | Covered |", file=summary)
              print("| --- | ---: | ---: |", file=summary)
              for metric in ("LINE", "BRANCH"):
                  counter = root.find(f"./counter[@type='{metric}']")
                  covered = int(counter.get("covered"))
                  total = covered + int(counter.get("missed"))
                  print(f"| {metric.title()} | {covered / total:.2%} | {covered:,} / {total:,} |", file=summary)
          PY

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
            target/spotbugsXml.xml
            target/spotbugs.sarif

      - name: Upload SpotBugs results to code scanning
        if: ${{ !cancelled() && steps.quality.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs
